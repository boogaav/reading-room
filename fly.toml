app = "wikibook-reading-room"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8208
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  # 512MB, not 256: a cold build parses a ~1.4MB Parsoid document with cheerio
  # and holds 140 Wikidata entity payloads at once.
  memory = "512mb"
