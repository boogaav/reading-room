<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A library — Reading Room</title>
<meta name="robots" content="noindex">
<script>
// Applied before first paint: a deferred module would flash the wrong theme.
(function () {
  try {
    var t = localStorage.getItem('readingroom.theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
})();
</script>
<link rel="stylesheet" href="/reader.css">
<link rel="stylesheet" href="/home.css">
<link rel="preconnect" href="https://upload.wikimedia.org">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body class="home">

  <header class="hall-bar">
    <a class="hall-mark" href="/">Reading&nbsp;Room</a>
    <div class="lib-head">
      <h1 class="lib-title" id="libTitle">…</h1>
      <p class="lib-sub" id="libSub"></p>
    </div>
    <div class="lib-actions" id="libActions"></div>
    <button class="voice-btn" id="voiceBtn" aria-pressed="false" hidden></button>
    <button class="theme-btn" id="themeBtn" aria-pressed="false"></button>
  </header>

  <main class="room">
    <div class="shelves" id="shelves" aria-label="This library">
      <p class="shelf-loading" id="shelfLoading">Unlocking the door…</p>
    </div>

    <section class="colophon-strip" id="libFoot"></section>
  </main>

  <script type="module" src="/library.js"></script>
</body>
</html>
