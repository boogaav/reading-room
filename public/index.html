<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Room</title>
<script>
// Applied before first paint: a deferred module would flash the wrong theme.
(function () {
  try {
    var t = localStorage.getItem('readingroom.theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
})();
</script>
<link rel="stylesheet" href="/reader.css">
<link rel="preconnect" href="https://upload.wikimedia.org">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" onerror="window.__noLeaflet=1">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" onerror="window.__noLeaflet=1"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
  <div class="progress"><div class="progress-fill" id="progress"></div></div>

  <aside class="rail" id="rail" aria-label="Table of contents">
    <div class="rail-head">
      <a class="rail-home" href="/">Reading&nbsp;Room</a>
      <div class="rail-actions">
        <button class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false"
                aria-label="Read this article in another language" hidden></button>
        <button class="theme-btn" id="themeBtn" aria-pressed="false"></button>
        <button class="rail-toggle" id="railToggle" aria-label="Toggle contents">☰</button>
      </div>
    </div>
    <div class="lang-panel" id="langPanel" role="listbox" hidden></div>
    <nav class="toc" id="toc"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <main id="book" class="book">
    <div class="binder" id="binder">
      <div class="binder-inner">
        <div class="binder-eyebrow">Binding</div>
        <h1 class="binder-title" id="binderTitle">a Wikipedia volume</h1>
        <ol class="binder-stages" id="binderStages"></ol>
        <p class="binder-foot">Parsoid HTML and Wikidata claims. No language model is involved.</p>
      </div>
    </div>
  </main>

  <div class="hovercard" id="hovercard" hidden></div>
  <div class="notecard" id="notecard" hidden></div>
  <script type="module" src="/reader.js"></script>
</body>
</html>
